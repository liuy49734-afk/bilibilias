name: 自动打包APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 强制拉取所有代码 + 子模块
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true  # 关键：开启子模块拉取
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 配置JDK
      - name: 配置JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      # 3. 给脚本加权限
      - name: 给gradlew加权限
        run: chmod +x gradlew

      # 4. 编译Release APK
      - name: 编译Release APK
        run: ./gradlew clean assembleRelease --stacktrace

      # 5. 上传所有APK文件
      - name: 上传APK文件
        uses: actions/upload-artifact@v4
        with:
          name: 我的APK文件
          path: '**/build/outputs/apk/release/*.apk'
